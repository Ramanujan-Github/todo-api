services:
  app:
    build: .
    container_name: todo-app
    ports:
      - "7806:7806"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/todoapp?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: todo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: